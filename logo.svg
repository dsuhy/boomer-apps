<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Geometric car silhouette mark -->
  <g transform="translate(0, 4)">
    <!-- Car body - angular/geometric -->
    <polygon points="6,28 14,12 28,8 38,12 42,20 42,28" fill="#1a1a1a"/>
    <!-- Windshield cutout -->
    <polygon points="16,14 26,11 33,14 30,20 18,20" fill="#e8ff58"/>
    <!-- Reflection line across body -->
    <line x1="8" y1="22" x2="40" y2="18" stroke="#e8ff58" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Front wheel -->
    <circle cx="15" cy="28" r="5" fill="#1a1a1a"/>
    <circle cx="15" cy="28" r="2.2" fill="#f7f6f3"/>
    <!-- Rear wheel -->
    <circle cx="35" cy="28" r="5" fill="#1a1a1a"/>
    <circle cx="35" cy="28" r="2.2" fill="#f7f6f3"/>
    <!-- Ground line -->
    <line x1="4" y1="33" x2="44" y2="33" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Text -->
  <text x="56" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" letter-spacing="-0.3">EXTREME</text>
  <text x="56" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" letter-spacing="-0.3">REFLECTION</text>
  <!-- Accent dot -->
  <circle cx="148" cy="35" r="3" fill="#e8ff58"/>
</svg>
